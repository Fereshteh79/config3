{% extends 'account/base.html' %}
{% block title %}حذف مقاله{% endblock %}

{% block main %}
<div class="col-md-6 mx-auto mt-5 text-center">
    <h4>آیا از حذف مقاله "{{ object }}" از "{{ object.author.get_full_name }}" مطمئن هستید؟</h4>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger mt-3">حذف</button>
        <a href="{% url 'account:home' %}" class="btn btn-secondary mt-3">انصراف</a>
    </form>
</div>
{% endblock %}
