{% extends 'account/base.html' %}
{% load widget_tweaks %}
{% block title %}بازیابی رمز عبور{% endblock %}

{% block main %}
<div class="col-md-6 mx-auto mt-5">
    <h4>ایمیل خود را وارد کنید تا لینک بازیابی ارسال شود</h4>
    <form method="post">
        {% csrf_token %}
        {{ form.email|add_class:"form-control mb-2" }}
        <button class="btn btn-primary w-100">ارسال لینک بازیابی</button>
    </form>
</div>
{% endblock %}
