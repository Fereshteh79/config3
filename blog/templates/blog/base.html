{% load static %}
{% load base_tags %}
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>فرشته {% block title %}{% endblock %}</title>
    <link rel="icon" href="{% static 'blog/assets/favicon.ico' %}"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <link href="{% static 'blog/css/styles.css' %}" rel="stylesheet"/>
    <link href="{% static 'blog/css/rtl.css' %}" rel="stylesheet"/>
    <link rel="stylesheet" href="{% static 'star-ratings/css/star-ratings.css' %}">
    <script src="{% static 'star-ratings/js/dist/star-ratings.min.js' %}"></script>
    {% block custome-header %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light" id="mainNav">
    <div class="container px-4 px-lg-5">
        <a class="navbar-brand" href="{% url 'blog:home' %}">فرشته</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
            Menu <i class="fas fa-bars"></i>
        </button>
        {% category_navbar %}
    </div>
</nav>

{% block main %}{% endblock %}

<footer class="border-top">
    <div class="container px-4 px-lg-5 text-center">
        <ul class="list-inline">
            <li class="list-inline-item">
                <a href="#"><i class="fab fa-twitter fa-lg"></i></a>
            </li>
            <li class="list-inline-item">
                <a href="#"><i class="fab fa-facebook-f fa-lg"></i></a>
            </li>
            <li class="list-inline-item">
                <a href="#"><i class="fab fa-github fa-lg"></i></a>
            </li>
        </ul>
        <div class="small text-muted fst-italic">Copyright &copy; 2023</div>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'blog/js/scripts.js' %}"></script>
</body>
</html>
