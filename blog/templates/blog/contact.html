{% extends 'blog/base.html' %}
{% block title %}تماس با من{% endblock %}

{% block main %}
<header class="masthead" style="background-image: url('{% static "blog/assets/img/contact-bg.jpg" %}')">
    <div class="container position-relative px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7">
                <div class="page-heading">
                    <h1>تماس با من</h1>
                    <span class="subheading">سوال دارید؟ من پاسخ می‌دهم.</span>
                </div>
            </div>
        </div>
    </div>
</header>
<main class="mb-4">
    <div class="container px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-md-10 col-lg-8 col-xl-7">
                <p>فرم زیر را پر کنید تا با شما تماس گرفته شود.</p>
                <form id="contactForm" method="post">
                    {% csrf_token %}
                    <div class="form-floating mb-3">
                        <input class="form-control" id="name" name="name" type="text" placeholder="نام شما" required />
                        <label for="name">نام</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="email" name="email" type="email" placeholder="ایمیل" required />
                        <label for="email">ایمیل</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="phone" name="phone" type="tel" placeholder="شماره تماس" required />
                        <label for="phone">شماره تماس</label>
                    </div>
                    <div class="form-floating mb-3">
                        <textarea class="form-control" id="message" name="message" placeholder="پیام شما" style="height: 12rem" required></textarea>
                        <label for="message">پیام</label>
                    </div>
                    <button type="submit" class="btn btn-primary">ارسال پیام</button>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
